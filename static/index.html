<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>To-Do-Re-Mi</title>
<style>
:root{--bg:#fafaf8;--fg:#1c1c1a;--mut:#74746e;--card:#fff;--line:#e4e3de;--acc:#2f6fed}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ececea;--mut:#9a9a93;--card:#1f1f1d;--line:#33332f;--acc:#6b9bff}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 16px}
form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
input[name=title]{flex:1;min-width:180px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.t{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.t .m{flex:1}.sub{color:var(--mut);font-size:13px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.p5{border-color:#d33;color:#d33}.p4{border-color:#e90;color:#e90}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
</style></head><body><main>
<div class="bar"><h1>🎵 To-Do-Re-Mi</h1><button class="p" onclick="replan()">Replan &amp; sync Outlook</button></div>
<form onsubmit="add(event)">
 <input name="title" placeholder="Add a task…" required>
 <input name="est" type="number" min="5" step="5" value="30" style="width:80px" title="minutes">
 <select name="imp"><option value="3">Normal</option><option value="5">Critical</option><option value="4">High</option><option value="2">Low</option></select>
 <input name="due" type="datetime-local">
 <button class="p">Add</button>
</form>
<div id="list"></div>
<script>
const fmt=s=>s?new Date(s).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'}):null;
async function load(){
 const r=await (await fetch('/api/tasks')).json();
 document.getElementById('list').innerHTML=r.map(t=>`<div class="t">
  <button onclick="done(${t.id})" title="Mark done">✓</button>
  <div class="m"><div>${esc(t.title)}</div>
  <div class="sub">${t.est_minutes}m · ${t.due?'due '+fmt(t.due):'no deadline'} · ${t.slot_start?'🗓 '+fmt(t.slot_start):'unscheduled'}</div></div>
  <span class="pill p${t.importance}">P${t.importance}</span>
  <button onclick="del(${t.id})" title="Delete">✕</button></div>`).join('')||'<p class="sub">Nothing yet.</p>';
}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function add(e){e.preventDefault();const f=new FormData(e.target);
 await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
  title:f.get('title'),est_minutes:+f.get('est'),importance:+f.get('imp'),
  due:f.get('due')?new Date(f.get('due')).toISOString():null})});
 e.target.reset();load();}
async function done(id){await fetch(`/api/tasks/${id}/done`,{method:'POST'});load();}
async function del(id){await fetch(`/api/tasks/${id}`,{method:'DELETE'});load();}
async function replan(){await fetch('/api/replan',{method:'POST'});load();}
load();
</script></main></body></html>
